<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hear Me Out Board - Party Game</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                            900: '#0c4a6e'
                        }
                    },
                    animation: {
                        'slam': 'slamIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'shake': 'shake 0.3s ease-in-out'
                    },
                    keyframes: {
                        slamIn: {
                            '0%': { opacity: '0', transform: 'scale(2.5) rotate(-10deg)', filter: 'blur(10px)' },
                            '70%': { transform: 'scale(0.95) rotate(2deg)', filter: 'blur(0px)' },
                            '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)' }
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-4px) translateY(2px)' },
                            '75%': { transform: 'translateX(4px) translateY(-2px)' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .board-grid {
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 24px 24px;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.4); }
        }
        .floating-emoji {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Header -->
    <header class="w-full p-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-sky-500 flex items-center justify-center text-xl shadow-lg shadow-sky-500/20">
                🔥
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Hear Me Out <span class="text-sky-400">Board</span></h1>
        </div>
        <div id="room-badge" class="hidden px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-xs font-mono text-sky-400 font-semibold">
            ROOM: <span id="badge-code">------</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto p-4 md:p-6 flex flex-col items-center justify-center">

        <!-- LOBBY / SETUP -->
        <section id="view-setup" class="w-full max-w-md bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-5">
            <h2 class="text-2xl font-bold text-center">Profil & Raum</h2>
            
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 uppercase">Dein Name</label>
                <input type="text" id="username-input" placeholder="z. B. Alex" maxlength="15" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-sky-500 transition-colors">
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button id="btn-tab-create" onclick="setMode('create')" class="py-2 rounded-xl text-sm font-bold bg-sky-500 text-white">Raum Erstellen</button>
                <button id="btn-tab-join" onclick="setMode('join')" class="py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-400 hover:text-white">Beitreten</button>
            </div>

            <div id="panel-create" class="space-y-4">
                <button onclick="createRoom()" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-white font-bold rounded-xl shadow-lg shadow-sky-500/20 transition-all">
                    Raum Starten
                </button>
            </div>

            <div id="panel-join" class="space-y-4 hidden">
                <input type="text" id="join-code" placeholder="6-Stelliger Code" maxlength="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-center font-mono uppercase text-lg text-white">
                <button onclick="joinRoom()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl transition-all">
                    Beitreten
                </button>
            </div>
        </section>

        <!-- GAMEPLAY / BOARD VIEW -->
        <section id="view-board" class="w-full max-w-5xl flex flex-col gap-4 hidden">
            
            <!-- Top Controls & Timer -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4">
                <div>
                    <span class="text-xs text-slate-400 font-semibold uppercase">Am Zug</span>
                    <p id="current-player-display" class="text-lg font-bold text-sky-400">---</p>
                </div>

                <!-- Timer Bar Container -->
                <div class="flex-1 max-w-xs space-y-1">
                    <div class="flex justify-between text-xs text-slate-400 font-mono">
                        <span>ZEIT</span>
                        <span id="timer-text">45s</span>
                    </div>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                        <div id="timer-bar" class="h-full bg-sky-500 transition-all duration-1000 w-full"></div>
                    </div>
                </div>

                <!-- Live Reactions Bar (Triggert KEINEN Timer-Reset) -->
                <div class="flex items-center gap-2">
                    <button onclick="triggerEmoji('🔥')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xl active:scale-95 transition-transform">🔥</button>
                    <button onclick="triggerEmoji('💀')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xl active:scale-95 transition-transform">💀</button>
                    <button onclick="triggerEmoji('😳')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xl active:scale-95 transition-transform">😳</button>
                    <button onclick="triggerEmoji('👑')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xl active:scale-95 transition-transform">👑</button>
                </div>
            </div>

            <!-- Whiteboard Area -->
            <div id="board-canvas" class="relative board-grid bg-slate-950 border border-slate-800 rounded-3xl min-h-[420px] p-6 flex flex-wrap gap-4 items-center justify-center overflow-hidden shadow-2xl">
                <p id="board-empty-msg" class="text-slate-600 text-sm italic">Das Board ist noch leer. Füge das erste Bild hinzu!</p>
            </div>

            <!-- Upload Input Dock -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col md:flex-row gap-3 items-center">
                <input type="file" id="image-upload" accept="image/*" class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-500/10 file:text-sky-400 hover:file:bg-sky-500/20 cursor-pointer">
                
                <!-- NAME IST JETZT OPTIONAL -->
                <input type="text" id="pick-name" placeholder="Name/Titel (Optional)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                
                <button onclick="submitPick()" class="w-full md:w-auto px-6 py-2.5 bg-sky-500 hover:bg-sky-400 text-white font-bold rounded-xl shadow-lg shadow-sky-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Aufs Board!
                </button>
            </div>
        </section>

    </main>

    <script>
        let currentMode = 'create';
        let timerSeconds = 45;
        let timerInterval = null;
        let activePickImage = null;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('panel-create').classList.toggle('hidden', mode !== 'create');
            document.getElementById('panel-join').classList.toggle('hidden', mode !== 'join');
            document.getElementById('btn-tab-create').className = mode === 'create' ? 'py-2 rounded-xl text-sm font-bold bg-sky-500 text-white' : 'py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-400';
            document.getElementById('btn-tab-join').className = mode === 'join' ? 'py-2 rounded-xl text-sm font-bold bg-sky-500 text-white' : 'py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-400';
        }

        function createRoom() {
            const name = document.getElementById('username-input').value.trim() || 'Player';
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-board').classList.remove('hidden');
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('badge-code').innerText = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('current-player-display').innerText = name;
            startTimer();
        }

        function joinRoom() {
            createRoom();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 45;
            updateTimerUI();
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerUI();
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('timer-text').innerText = timerSeconds + 's';
            const pct = (timerSeconds / 45) * 100;
            const bar = document.getElementById('timer-bar');
            bar.style.width = pct + '%';
            if (timerSeconds <= 10) {
                bar.className = 'h-full bg-red-500 animate-pulse transition-all duration-1000';
            } else {
                bar.className = 'h-full bg-sky-500 transition-all duration-1000';
            }
        }

        // Image Selection
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    activePickImage = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Submit Pick onto Board
        function submitPick() {
            if (!activePickImage) {
                alert("Bitte wähle zuerst ein Bild aus!");
                return;
            }

            const nameInput = document.getElementById('pick-name').value.trim();
            const displayName = nameInput !== "" ? nameInput : null; // Name ist optional!
            
            const emptyMsg = document.getElementById('board-empty-msg');
            if (emptyMsg) emptyMsg.remove();

            const canvas = document.getElementById('board-canvas');
            
            // Create Card Container mit der geilen Slam-In Animation
            const card = document.createElement('div');
            card.className = "relative bg-slate-900 border border-slate-700/60 p-3 rounded-2xl shadow-2xl flex flex-col items-center gap-2 max-w-[200px] animate-slam hover:scale-105 transition-transform duration-200 cursor-pointer group";

            let nameHTML = displayName ? `<span class="text-xs font-bold text-slate-200 truncate max-w-[170px]">${displayName}</span>` : '';

            card.innerHTML = `
                <div class="w-40 h-40 rounded-xl overflow-hidden bg-black/40 border border-slate-800 flex items-center justify-center">
                    <img src="${activePickImage}" class="w-full h-full object-cover">
                </div>
                ${nameHTML}
            `;

            canvas.appendChild(card);

            // Confetti Burst bei neuem Card-Drop
            confetti({
                particleCount: 25,
                spread: 60,
                origin: { y: 0.7 }
            });

            // Reset Input Form
            document.getElementById('image-upload').value = '';
            document.getElementById('pick-name').value = '';
            activePickImage = null;
        }

        // Trigger Reactions (OHNE Timer-Reset)
        function triggerEmoji(emoji) {
            const canvas = document.getElementById('board-canvas');
            const el = document.createElement('div');
            el.className = 'floating-emoji text-3xl';
            el.innerText = emoji;
            
            // Zufällige Position auf dem Board
            const x = Math.random() * (canvas.clientWidth - 40);
            const y = Math.random() * (canvas.clientHeight - 40);
            
            el.style.left = x + 'px';
            el.style.top = y + 'px';

            canvas.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 1200);
        }
    </script>
</body>
</html>
